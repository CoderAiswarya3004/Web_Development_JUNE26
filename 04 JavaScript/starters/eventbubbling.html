<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="parent">
        <div id="child1">
            <div id="child2">
                <div id="child3">
                    <div id="child4"><button>click</button></div>
                </div>
            </div>
        </div>
    </div>
    <script>
        children1 = document.querySelector("#child1")
        children2 = document.querySelector("#child2")
        children3 = document.querySelector("#child3")
        children4 = document.querySelector("#child4")
        parent1 = document.querySelector("#parent")

        children1.addEventListener("click",(e) =>{
            alert("child is 1th")
        })
        children2.addEventListener("click",(e) =>{
            alert("child is 2nd")
        })
        children3.addEventListener("click",(e) =>{
            alert("child is 3rd")
        })
        children4.addEventListener("click",(e) =>{
            alert("child is 4th")
        })
        parent1.addEventListener("click",(e) =>{
            alert("I am parent")
        })
    </script>
</body>
</html>
