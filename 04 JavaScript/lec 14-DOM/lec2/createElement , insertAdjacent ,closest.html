<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            border: 2px solid black;
            padding :10px;
        }

        .highlight{
            background-color: yellow;
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <p id="first-paragraph">This is the first para graph</p>
    </div>

    <script>
        const container = document.querySelector(".container")
        // createElement ----------------
        const newParaGraph = document.createElement("p")
        container.append(newParaGraph)
        newParaGraph.textContent="This is dynamically created paragraph"
        newParaGraph.id = "new-Paragraph"
        // newParaGraph.className = "new-paragraph"
        // newParaGraph.className = "new-paragraph1"
        // newParaGraph.style.backgroundColor = "green"
        newParaGraph.classList.add("new-paragraph")
        newParaGraph.classList.add("new-paragraph1")
        newParaGraph.classList.add("highlight")

        //insertAdjacentHTML --------------------
        container.insertAdjacentHTML("beforeend","<p id ='htmlParagraph'>inserted before end</p>")
        container.insertAdjacentHTML("afterend","<p id ='htmlParagraph'>inserted after end</p>")

        //insertAdjacentElement -----------------

        const newSpan = document.createElement("span")
        newSpan.textContent = "inserted element before begin"
        container.insertAdjacentElement("beforebegin",newSpan)

        const anotherNewSpan = document.createElement("span")
        anotherNewSpan.textContent = "inserted element after dynamically created paragraph"
        newParaGraph.insertAdjacentElement("afterend",anotherNewSpan)

        //closest() ----------------
        

    </script>
</body>
</html>
