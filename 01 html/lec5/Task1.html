<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table-Spanning</title>
</head>
<body>
    <table border="2">
    <tbody>
        <caption><b>HTML Table</b></caption>
        <tr>
        <td colspan="2"><center>cell 1</center></td>
        <td>cell 2</td>
        <td>cell3</td>
        </tr>
        <tr>
            <td rowspan="3">cell 4</td>
            <td>cell 5</td>
            <td>cell 6</td>
            <td>cell 7</td>
        </tr>
        <tr>
            <td colspan="3"><center>cell 8</center></td>
        </tr>
        <tr>
            <td>cell 9</td>
            <td colspan="2"><center>cell 10</center></td>
        </tr>
    </tbody>    
    </table>
</body>
</html>
