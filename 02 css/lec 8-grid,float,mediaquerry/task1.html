<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container
        {
            /* height:60vh; */
            width:800px;
            box-shadow: 2px 2px 2px black;
            background-color: aqua;
        }
        .mainbox{
            padding-left: 50px;
            display:grid;
            /* height:60vh;  */
            width:400px;
            grid-template-columns: repeat(5,1fr);
            grid-template-rows: repeat(2,1fr);
            gap:20px;
        }
        .box1
        {
            grid-column-start:span 2;
            column-gap: 10px;
            display:flex;
            justify-content: center;
            align-items: center;
        }
        .box3
        {
            grid-column-start:span 2;
            grid-row-start: span 2;
            display:flex;
            justify-content: center;
            align-items: center;
        }
        .box5
        {
            grid-column-start:span 2;
            display:flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="mainbox">
            <div class="box1" style="background-color: purple">1</div>
            <div class="box2" style="background-color: navy">2</div>
            <div class="box3" style="background-color: chartreuse">3</div>
            <div class="box2" style="background-color: aliceblue;">4</div>
            <div class="box5" style="background-color: black;">5</div>
        </div>
    </div>
</body>
</html>
